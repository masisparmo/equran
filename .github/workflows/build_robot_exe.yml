name: Build Robot EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'robot-equran/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r robot-equran/requirements.txt || pip install requests PySide6 playwright pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        cd robot-equran
        pyinstaller --noconfirm --onedir --windowed --icon "app_icon.ico" --name "Robot_E_Quran" --add-data "app_icon.png;."  "bot_gui.py"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Robot_E_Quran_Windows
        path: robot-equran/dist/Robot_E_Quran/
